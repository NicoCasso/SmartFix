<!DOCTYPE html>
<html>
<head>
    <title>Default Template</title>
</head>
<body>
    <div id="chat">
        <div id="messages"></div>
        <input type="text" id="messageInput" placeholder="Tapez votre message ici...">
        <button onclick="sendMessage()">Envoyer</button>
    </div>

    <script>
        function sendMessage() {
            const message = document.getElementById('messageInput').value;
            fetch('/chat/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: `message=${encodeURIComponent(message)}`
            })
            .then(response => response.json())
            .then(data => {
                const messagesDiv = document.getElementById('messages');
                messagesDiv.innerHTML += `<p>Vous: ${message}</p><p>Chatbot: ${data.message}</p>`;
                document.getElementById('messageInput').value = ''; // Efface le champ de saisie après l'envoi
            })
            .catch(error => console.error('Erreur:', error));
        }
    </script>
</body>
</html>
